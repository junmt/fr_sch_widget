name: CI

# プルリクエスト（Dependabot の更新など）のときだけ、テストを流す。
# main への push では動かさない（テストとビルドはリリースのワークフローで行う）
on:
  pull_request:

permissions:
  contents: read

# 同じプルリクエストに続けて push したら、古い方の実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 画面のテスト（TypeScript）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  windows:
    name: Rust のテスト（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # tauri::generate_context! が dist を埋め込むため、テストの前に画面をビルドしておく
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
