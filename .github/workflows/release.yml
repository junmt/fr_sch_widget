name: Release

# v0.1.0 のようなタグを push すると、インストーラーを作って GitHub のリリースに公開する
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: タグと tauri.conf.json のバージョンが同じか確認する
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "タグ ${{ github.ref_name }} と tauri.conf.json の version ($version) が違います"
            exit 1
          }
      # リリースは最初に作る。ビルドの後に作ると、その間に main のワークフローが変わったとき
      # GITHUB_TOKEN では作れない（Resource not accessible by integration）ことがあるため
      - name: リリースを作る
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG --json databaseId *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --verify-tag --title "F-RevoCRM Schedule Widget $env:TAG" --notes "Windows 用のインストーラー（*_x64-setup.exe）をダウンロードして実行してください。使い方は README を参照してください。"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $id = gh release view $env:TAG --json databaseId --jq .databaseId
          "id=$id" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # rust-cache は使わない（タグで保存したキャッシュは次のタグから使えず、保存の時間だけかかるため）
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      # インストーラーのビルド（tauri build は `--features tauri/custom-protocol --release` で cargo を呼ぶ）と
      # 同じ設定でテストして、依存ライブラリのコンパイルを共有する
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --release --features tauri/custom-protocol
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自動アップデート用の署名（公開鍵は tauri.conf.json の plugins.updater.pubkey）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 最初に作ったリリースにアップロードするだけにする（releaseId を渡すと、リリースの作成・更新はしない）
          releaseId: ${{ steps.release.outputs.id }}
          # 自動アップデートが読む latest.json もリリースに上げる
          uploadUpdaterJson: true
