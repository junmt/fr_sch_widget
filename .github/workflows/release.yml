name: Release

# v0.1.0 のようなタグを push すると、インストーラーを作って GitHub のリリースに公開する
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: タグと tauri.conf.json のバージョンが同じか確認する
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "タグ ${{ github.ref_name }} と tauri.conf.json の version ($version) が違います"
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自動アップデート用の署名（公開鍵は tauri.conf.json の plugins.updater.pubkey）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: F-RevoCRM Schedule Widget ${{ github.ref_name }}
          releaseBody: |
            Windows 用のインストーラー（`*_x64-setup.exe`）をダウンロードして実行してください。
            使い方は README を参照してください。
          # 自動アップデートが読む latest.json もリリースに上げる
          uploadUpdaterJson: true
          releaseDraft: false
          prerelease: false
