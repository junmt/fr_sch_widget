[package]
name = "fr-sch-widget"
version = "0.1.9"
description = "F-RevoCRM Schedule Widget（F-RevoCRM の今日の予定を表示する Windows ウィジェット）"
edition = "2021"

[lib]
name = "fr_sch_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS は Windows の証明書ストアを使う native-tls（SChannel）にする（社内の証明書を Windows に登録すれば使えるように）
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.8"
keyring = { version = "3", features = ["windows-native"] }
log = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# ビルドの速さを優先して thin LTO にする（サイズの差は小さい）
[profile.release]
lto = "thin"
opt-level = "s"
strip = true
